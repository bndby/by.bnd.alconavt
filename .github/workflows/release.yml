# Выпуск APK на push в main. Правила версии: docs/adr/0003-troyka-vypuska.md

name: Выпуск

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "!app/src/test/**"
      - "!app/src/androidTest/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
      - "scripts/release-version.sh"
      - "scripts/release-version.test.bash"

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Сборка и выпуск
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Код
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Секреты подписи
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              printf 'Нет секрета %s\n' "$name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            printf 'Выпуск не создан: нет ключа подписи.\n' >&2
            exit 1
          fi

      - name: Проверка скрипта версии
        run: bash scripts/release-version.test.bash

      - name: План версии
        id: plan
        run: |
          set -euo pipefail
          bash scripts/release-version.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/release.env"
          source "$RUNNER_TEMP/release.env"
          {
            printf 'mode=%s\n' "$mode"
            printf 'version=%s\n' "$version"
            printf 'version_code=%s\n' "$version_code"
          } >> "$GITHUB_OUTPUT"
          printf 'Выпуск %s, код %s, режим %s\n' "$version" "$version_code" "$mode"

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Unit-тесты
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Ключ подписи
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon \
            -PreleaseVersionName="${{ steps.plan.outputs.version }}" \
            -PreleaseVersionCode="${{ steps.plan.outputs.version_code }}"
          src="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$src" ]]; then
            printf 'Нет подписанного APK\n' >&2
            exit 1
          fi
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          signer=$(find "$sdk/build-tools" -type f -name apksigner | sort | tail -1)
          if [[ -z "$signer" ]]; then
            printf 'Нет apksigner\n' >&2
            exit 1
          fi
          "$signer" verify "$src"
          cp "$src" "$RUNNER_TEMP/alconavt-${{ steps.plan.outputs.version }}.apk"

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.plan.outputs.version }}"
          apk="$RUNNER_TEMP/alconavt-${{ steps.plan.outputs.version }}.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "${{ steps.plan.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease \
              --latest=false
          fi
